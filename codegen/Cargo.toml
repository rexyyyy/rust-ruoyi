[package]
name = "codegen"
version = "0.2.0"
edition = "2021"
description = "RuoYi-Rust 代码生成器引擎：读取 PostgreSQL/MySQL 元数据，按模板生成 actix-web + sea-orm 后端代码与 Vue3 前端代码"

# 既作为库被 backend 依赖，也可独立命令行运行
[lib]
name = "codegen"
path = "src/lib.rs"

[[bin]]
name = "codegen-cli"
path = "src/main.rs"

# 数据库驱动按 feature 选择，默认 mysql（与 backend 保持一致）。
# backend 以 default-features = false 引入本库，并把自己的方言 feature 透传过来，
# 因此默认构建只编入 mysql 驱动，只有切到 PostgreSQL 时才编入 pg 驱动。
[features]
default = ["mysql"]
mysql = ["sea-orm/sqlx-mysql"]
postgres = ["sea-orm/sqlx-postgres"]
# 与 backend 的 feature 名保持一致，避免两处命名不同踩坑（等价于 postgres）
postgresql = ["postgres"]

[dependencies]
# —— 与 backend 保持同一套 ORM 与运行时，避免「生成的东西和主项目不是一套」——
# 驱动 feature 由上面的 [features] 控制，不在这里硬编码（否则会与 backend 的
# feature 合并，导致默认构建同时带上两个驱动）。
sea-orm = { version = "1.1", default-features = false, features = [
    "runtime-tokio-native-tls",
    "macros",
    "with-chrono",
] }
tokio = { version = "1", features = ["full"] }
once_cell = "1.20.2"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tera = "1"
# 说明：ZIP 打包自带实现（STORE 无压缩，见 src/util/ziputil.rs）。
# zip crate 在 2.x/8.x 之间 API 差异大，为一个仅用于下载打包的小功能引入
# 版本风险与编译开销并不划算，故不依赖外部 zip 库。

[profile.release]
lto = true

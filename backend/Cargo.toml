[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ruoyi_rust_prod"
path = "src/main.rs"

[[bin]]
name = "ruoyi_rust_dev"
path = "src/main.rs"

# 双方言支持：postgresql（默认）/ mysql。连接串（postgres:// 或 mysql://）决定实际后端，
# 原生 SQL 经 crate::db::raw_stmt 按后端自动改写占位符（$N -> ?）。
[features]
default = ["postgresql"]
postgresql = ["sea-orm/sqlx-postgres", "sea-orm-adapter/postgres"]
mysql = ["sea-orm/sqlx-mysql", "sea-orm-adapter/mysql"]

[dependencies]
codegen = { path = "../codegen" }
actix = "0.13"
actix-tls = "3.4"
actix-utils = "3"
actix-web = "4.11"
actix-cors = "0.7"
actix-http = "3.11"
actix-multipart = "0.7"
actix-files = "0.6"
actix-ws = "0.3"
actix-web-validator = "6.0.0"
validator ={ version = "0.18", features = ["derive"] } #加入验证框架 "0.18.1"

jsonwebtoken = "9.3.0"
captcha = "0.0.9"
image = "0.25.2"

bcrypt = "0.15.1"
# rust-crypto 仅保留用于校验历史（SHA3-256）密码哈希，新密码一律 bcrypt
rust-crypto = "0.2.36"

async-std = "1.13.0"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.33"
merge-yaml-hash = "0.4.0"

fastdate = { version = "0.3" }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7.12"
tokio-stream = "0.1.16"
once_cell = "1.20.2"
futures-util = "0.3.31"

# aio: 异步 multiplexed 连接；connection-manager: 自动重连 + 连接复用（替代同步阻塞客户端）
redis = { version = "0.29.1", features = ["tokio-comp", "connection-manager"] }

parking_lot = "0.12.3"
uuid = { version = "1.10.0", features = ["v4"] }
url = "2.5.2"
chrono = { version = "0.4.38", features = ["serde"] }
user-agent-parser = "0.3.6"
base64 = "0.22.1"
bytesize = "1.3.0"

log = "0.4.22"
fast_log = "1.7.4"

sysinfo = "0.28.2"
sea-orm = { version = "1.1", default-features = false, features = ["runtime-tokio-native-tls", "macros", "with-chrono"] }
casbin = { version = "2.10", default-features = false, features = ["runtime-tokio"] }
sea-orm-adapter = { path = "./sea-orm-adapter", default-features = false, features = ["runtime-tokio-native-tls"] }
pinyin = "0.10.0"
rust_xlsxwriter = "0.99.1"
calamine = "0.36.1"
# actix-web-lab = "0.24.3"
# actix-web-actors = "4.3.1"

# 定时任务调度器用 cron 表达式解析（自研轮询调度，不依赖 apalis）
cron = "0.16"

[profile.release]
lto = true
opt-level = 'z'
codegen-units = 1

[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ruoyi_rust_prod"
path = "src/main.rs"

[[bin]]
name = "ruoyi_rust_dev"
path = "src/main.rs"

# 双方言支持：mysql（默认）/ postgresql。连接串（mysql:// 或 postgres://）决定实际后端，
# 原生 SQL 经 crate::db::raw_stmt 按后端自动改写占位符（$N -> ?）。
# 切到 PostgreSQL：cargo build --no-default-features --features postgresql
#
# 注：codegen / sea-orm-adapter 均以 default-features = false 引入，各自的驱动 feature
# 由下面统一透传，保证默认构建只编入 mysql 驱动，不会因 feature 合并再带回 pg 驱动。
[features]
default = ["mysql"]
mysql = ["sea-orm/sqlx-mysql", "sea-orm-adapter/mysql", "codegen/mysql"]
postgresql = [
    "sea-orm/sqlx-postgres",
    "sea-orm-adapter/postgres",
    "codegen/postgres",
]

[dependencies]
codegen = { path = "../codegen", default-features = false }
actix = "0.13"
actix-tls = "3.4"
actix-utils = "3"
actix-web = "4.11"
actix-cors = "0.7"
actix-http = "3.11"
actix-multipart = "0.7"
actix-files = "0.6"
actix-ws = "0.3"
actix-web-validator = "6.0.0"
validator ={ version = "0.18", features = ["derive"] } #加入验证框架 "0.18.1"

jsonwebtoken = "9.3.0"
captcha = "0.0.9"
image = "0.25.2"

bcrypt = "0.15.1"
# rust-crypto 仅保留用于校验历史（SHA3-256）密码哈希，新密码一律 bcrypt
rust-crypto = "0.2.36"

async-std = "1.13.0"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.33"
merge-yaml-hash = "0.4.0"

fastdate = { version = "0.3" }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7.12"
tokio-stream = "0.1.16"
once_cell = "1.20.2"
futures-util = "0.3.31"

# aio: 异步 multiplexed 连接；connection-manager: 自动重连 + 连接复用（替代同步阻塞客户端）
redis = { version = "0.29.1", features = ["tokio-comp", "connection-manager"] }

parking_lot = "0.12.3"

# 进程内高性能缓存：LRU/TinyLFU 淘汰 + TTL + 加权容量预算，作为 cache_type 的默认后端。
# 依赖 feature "future"（异步 API），不使用 sync 版本。
moka = { version = "0.12", features = ["future"] }
uuid = { version = "1.10.0", features = ["v4"] }
url = "2.5.2"
chrono = { version = "0.4.38", features = ["serde"] }
user-agent-parser = "0.3.6"
base64 = "0.22.1"
bytesize = "1.3.0"

log = "0.4.22"
fast_log = "1.7.4"

sysinfo = "0.28.2"
sea-orm = { version = "1.1", default-features = false, features = ["runtime-tokio-native-tls", "macros", "with-chrono"] }
casbin = { version = "2.10", default-features = false, features = ["runtime-tokio"] }
sea-orm-adapter = { path = "./sea-orm-adapter", default-features = false, features = ["runtime-tokio-native-tls"] }
pinyin = "0.10.0"
rust_xlsxwriter = "0.99.1"
calamine = "0.36.1"
# actix-web-lab = "0.24.3"
# actix-web-actors = "4.3.1"

# 定时任务调度器用 cron 表达式解析（自研轮询调度，不依赖 apalis）
cron = "0.16"

# 面向服务端吞吐优化：
# - opt-level = 3：原配置为 'z'（优先二进制体积），会关闭向量化与部分内联，
#   JSON (de)serialize / bcrypt / SQL 参数绑定等热点明显变慢；服务端更看重吞吐而非体积。
# - lto = "thin"：完整 fat LTO 在 40+ 依赖的图上编译能耗时数分钟，thin LTO 已能拿到
#   绝大部分跨 crate 内联收益，且保留并行 codegen。
# - codegen-units = 1：配合 LTO 拿到最优代码；如需更快出包可调到 4（代价约 5% 运行时）。
[profile.release]
lto = "thin"
opt-level = 3
codegen-units = 1
# 保留 unwind：actix worker panic 后由 supervisor 重启线程，abort 会让整个进程退出
panic = "unwind"

#debug模式，true输出控制台日志，false只输出文件日志.生产环境需要关闭debug，rbatis也需移除"debug_mode"
debug: true
#名称
server_name: "ruoyi_rust"
#server 地址
server_url: "0.0.0.0:60800"
#相对应若依平台的VITE_APP_BASE_API
base_api: "/dev-api"

#缓存后端类型，单选("moka","redis","mem")
#  moka（默认，推荐）：进程内 TinyLFU + TTL + 加权容量预算，零外部依赖即可启动；
#                     注意会话数据存在进程内存中，多实例部署必须改用 redis 才能共享登录态。
#  redis：多实例共享会话/缓存时使用，需配置下面的 web_redis_url。
#  mem ：旧 HashMap 实现，无容量上限且每次读写都全表扫描，不建议生产使用。
#留空或写成未知值时，会回落到 moka 并记 warn（不会 panic）。
cache_type: "moka"

# ---- 仅 cache_type = "moka" 时生效 ----
#加权容量预算（MB）：按 key+value 字节数计，达到上限按 TinyLFU 淘汰冷数据
cache_max_capacity_mb: 64
#兜底 TTL（秒）：0=不设全局上限（每条只按写入时的过期时间生效）；
#               >0 作为「最长存活时间」上限，防止无过期时间的 key（字典/菜单）永久驻留
cache_ttl_secs: 0
#空闲淘汰时长（秒）：0=关闭按空闲淘汰（只按 TTL）
cache_time_to_idle_secs: 0
#周期维护间隔（秒）：定期执行 moka 后台维护，使零流量时也能驱逐过期条目、刷新计数。0=关闭
cache_maintain_secs: 60

#web后台 redis地址(cache_type为“redis”时有效)
#开箱即用：指向本机默认端口，cache_type 切 redis 时无需再改
web_redis_url: "redis://127.0.0.1:6379" #这是db0

#后台用数据库地址（默认 MySQL 8）
#连接串 scheme 决定实际方言，但同时要与编译期驱动匹配（默认构建只带 mysql 驱动）。
#切到 PostgreSQL：改连接串 + 用 cargo build --no-default-features --features postgresql 重新编译。
database_url: "mysql://root:123456@127.0.0.1:3306/ruoyirust"
#database_url: "postgres://postgres:123456@127.0.0.1:5432/ruoyirust"
#逻辑删除-字段
logic_column: "del"
#逻辑删除-未删除标志
logic_un_deleted: 0
#逻辑删除-已删除标志
logic_deleted: 1
#日志文件存放目录
log_dir: "target/logs/"
#日志分割尺寸-单位KB,MB,GB
log_temp_size: "20MB"
#日志打包格式可选“”（空-保留.log）“gzip”（gz压缩包）“zip”（zip压缩包）“lz4”（lz4压缩包（非常快））
#需要打开以下选项
#toml文件里面，fast_log 添加   fast_log = { version = "1.5",features = ["lz4", "zip", "gzip"]}
#src/config/log.rs    解除   fn choose_packer()下的注释
#application.yml      添加   log_pack_compress: "zip"
log_pack_compress: ""
#日志滚动保留-保留全部: All,按时间保留(秒): KeepTime(i64),按版本保留: KeepNum(i64)
log_rolling_type: "KeepNum(20)"
#日志等级: off,info,error,warn,debug,trace
log_level: "info"
#Log channel length, null for unbounded queue, non-null for bounded queue (better performance)
log_chan_len: 100000
#JwtToken秘钥（开箱即用：直接给出默认值，clone 下来无需任何环境变量即可启动）
#  - 本值仅用于本地运行/教学演示，**生产部署必须替换**；
#  - 优先级：环境变量 JWT_SECRET > 本文件 jwt_secret > 代码内置默认值；
#  - 留空（""）或写成 changeme 等弱值，会自动回落到代码内置默认值（src/config/config.rs: DEFAULT_JWT_SECRET）；
#  - 生成随机密钥：openssl rand -hex 32（Linux/macOS）或 $env:JWT_SECRET=... 注入。
jwt_secret: "d921104b85cf0b33450f00608b499e5e52f8828ec6ebbda7cc5edcdd83d0baea"
#CORS 允许的前端来源白名单（如 https://admin.example.com）。
#留空 = 允许任意来源（仅便于开发，生产务必显式配置）。
cors_allowed_origins: []
#短信通道缓存（系统先把数据放入队列sms:send:，第三方短信sdk或程序需要从队列获取并发送，获得回执存入sms:resp:*）,格式为sms:send:手机号和sms:resp:手机号
sms_cache_send_key_prefix: "sms:send:"
#登陆失败拒绝策略，重试次数限制(0次无限制)
login_fail_retry: 3
#登陆失败重试次数限制超过后提示的等待时间（秒）
login_fail_retry_wait_sec: 30
#接口白名单（免登陆直接访问）
#匹配规则（安全语义：先把请求路径剥掉 base_api，再与白名单项比较）：
#  1. 归一化后与白名单项**精确相等**；
#  2. 命中目录型项（如 /dev-api/profile/avatar）且位于**路径段边界**（/avatarXxx 不算）。
#因此 `/evil/login`、`/system/user/login` 这类构造路径不会被放行；
#不带前缀的历史写法（如裸 `/login`）仍会与 `/dev-api/login` 等价，可继续兼容。
#推荐按下方写成带 /dev-api 前缀的完整路径，语义最清晰。
white_list_api:
  - "/"
  - "/dev-api/login"
  - "/dev-api/logout"
  - "/dev-api/register"
  - "/dev-api/captchaImage"
  - "/dev-api/auth/login"
  - "/dev-api/auth/logout"
  - "/dev-api/auth/code"
  - "/dev-api/auth/register"
  - "/dev-api/auth/tenant/list"
  - "/dev-api/resource/sse"
  - "/dev-api/resource/sse/close"
  - "/dev-api/profile/avatar"
#是否启用验证码
captcha_enabled: true
#验证码过期时间（分钟）
captcha_expired_min: 2
#Token过期时间（分钟）
token_expired_min: 60






#debug模式，true输出控制台日志，false只输出文件日志.生产环境需要关闭debug，rbatis也需移除"debug_mode"
# 生产环境关闭 debug：避免每个请求在热路径打 info 日志并降低内存/IO 开销。
debug: false
#server 地址
#server_url: "0.0.0.0:80"

#相对应若依平台的VITE_APP_BASE_API
base_api: "/prod-api"

#JwtToken秘钥：prod **必须**改写（用 `openssl rand -hex 32` 生成），
#或直接用环境变量 JWT_SECRET 注入（优先级最高，推荐）。
#未设置时回落到 application.yml 的默认值 —— 那只是「保证能启动」的演示值，切勿直接上线。
#jwt_secret: "请替换为随机强密钥，或设置环境变量 JWT_SECRET"

#接口白名单（免登陆直接访问）
#匹配规则与 application.yml 一致：先剥掉 base_api 再精确比较（或命中目录型前缀的路径段边界），
#已移除旧的「子串 / 任意后缀」宽松匹配。注意条目必须与当前 base_api（/prod-api）一致。
white_list_api:
  - "/"
  - "/prod-api/auth/login"
  - "/prod-api/auth/logout"
  - "/prod-api/auth/code"
  - "/prod-api/auth/register"
  - "/prod-api/auth/tenant/list"
  - "/prod-api/resource/sse"
  - "/prod-api/resource/sse/close"
  # RuoYi 标准前端顶层路径别名（http_server.rs 中注册的兼容路由）
  - "/prod-api/captchaImage"
  - "/prod-api/login"
  - "/prod-api/logout"
  - "/prod-api/register"
  # 静态资源：<img src="/prod-api/profile/avatar/xxx.png"> 不带 token
  - "/prod-api/profile/avatar"